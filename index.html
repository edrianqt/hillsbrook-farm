<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- start downloading the two main fonts straight away -->
    <link rel="preload" href="/fonts/fraunces-soft-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hillsbrook Farm: family-owned dairy farm in Socorro, Surigao del Norte. Island Pure Cow's Milk, fresh as Bucas Grande's sea breeze."
    />
    <meta name="theme-color" content="#0c5247" />
    <!-- share preview for Facebook, Messenger, Viber and X. Set SITE_URL (e.g. https://hillsbrook.farm) when the domain is ready,
         because Facebook needs the full address of the picture -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hillsbrook Farm" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:title" content="Hillsbrook Farm | Island Pure Cow's Milk" />
    <meta
      property="og:description"
      content="Fresh cow's milk from our family dairy farm in Socorro, Bucas Grande Island. Delivered every Saturday to Dapa Port and General Luna. Farm visits welcome."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/images/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hillsbrook Farm: Island Pure Cow's Milk. A 3D view of the farm with the cow shed, milking parlor and the welcome gate." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Hillsbrook Farm | Island Pure Cow's Milk from Socorro, Surigao del Norte</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
